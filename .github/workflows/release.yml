name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

# 发布是串行操作，禁止并发写同一个 Release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check (types + tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Type check & frontend build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-latest
            name: macos-x64
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            name: linux-x64
            args: --bundles deb,appimage
          - platform: windows-latest
            name: windows-x64
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci

      # 只构建，不在这里创建 Release；tag 与 Release 统一由 release 任务创建
      - name: Build Tauri app
        run: npm run tauri -- build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: devtools-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    name: Tag & publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$VERSION" != "$TAURI_VERSION" ]; then
            echo "::error::版本不一致：package.json=$VERSION，tauri.conf.json=$TAURI_VERSION"
            exit 1
          fi

          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，请先升级版本号"
            exit 1
          fi

          # 收集产物为数组，避免文件名含空格时被拆开
          FILES=()
          while IFS= read -r -d '' f; do
            FILES+=("$f")
          done < <(find artifacts -type f -print0)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::未找到任何构建产物"
            exit 1
          fi

          echo "即将创建 $TAG，产物清单："
          printf '%s\n' "${FILES[@]}"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "DevTools $TAG" \
            --generate-notes \
            --latest \
            "${FILES[@]}"
